async function stream(text,zh=''){const turn=++token;busy=true;let m={role:'ai',text:'',zh,typing:true};messages.push(m);render();if(matchMedia('(prefers-reduced-motion: reduce)').matches){m.text=text}else{for(let i=0;i<text.length;i+=4){if(turn!==token)return;m.text=text.slice(0,i+4);render();await new Promise(r=>setTimeout(r,18))}}if(turn!==token)return;m.text=text;m.typing=false;busy=false;render()}

function accept(t,sim){if(busy||stage>=frames.length)return;close();messages.push({role:'prompt',text:cue().cn},{role:'user',text:t});records.push({stage,text:t,support:ladder?3:0,sim});messages.push({role:'coach',text:frames[stage].teach});if(!sim)messages.push({role:'coach',text:'你的作答已记录。原型未接入语义评测；可回看原句对照本轮指定含义。'});stage++;draft='';ladder=false;if(stage<frames.length)stream(frames[stage].q,frames[stage].zh);else stream(activeUnit.theme==='social'?"Great, we're all set. See you then!":activeUnit.theme==='travel'?"You're welcome. Have a great day!":"Sounds good. Thanks, and see you in a bit!",activeUnit.theme==='social'?'好，那就说定了。到时候见！':activeUnit.theme==='travel'?'不客气。祝你今天愉快！':'好的，谢谢。一会儿见！')}

function practiceSentence(){const step=practiceStore[practiceKey].step;return practiceBank[practiceKey][step<3?0:step-2]}
function practiceMarkup(){const state=practiceStore[practiceKey],step=state.step;if(step>=3&&(!practiceBank[practiceKey][1]?.source||!practiceBank[practiceKey][2]?.source))return missingSourceMarkup();if(step===5)return `<header class="header row"><button class="back" onclick="App.practiceBack()">‹</button><b>表达加练</b></header><div class="scroll"><div class="summaryhero"><div class="stamp">✓</div><h2>从跟着说，<br>到换个内容再说。</h2><p class="muted space">${escape(practiceKey)}</p></div><div class="card">${practiceTasks.map((t,i)=>`<div class="row between" style="margin:12px 0"><b style="font-size:13px">${t}</b><small>${state.attempts[i]?.sim?'模拟完成':'已作答 · 未评测'}</small></div>`).join('')}</div><div class="hint"><b>这次做到了什么？</b><p style="font-size:13px">围绕同一个表达，完成了从有提示到无提示、从原句到两个新语境的五步练习。</p></div><div class="card"><h3>下一步：在聊天里自己用出来</h3><p>下次遇到合适的话题，试着不看中文提示，自主用上它。五步完成是练习记录，还不能直接判断已掌握。</p></div></div><div class="composer"><button class="primary" onclick="App.practiceBack()">${practiceReturn==='library'?'返回我的表达':'返回本次收获'}</button><button class="textbtn" style="width:100%" onclick="App.practiceRestart()">重新练这一组</button></div>`;
const sentence=practiceSentence();return `<header class="header"><div class="row between"><button class="back" onclick="App.practiceBack()">‹</button><div><h3>${escape(practiceKey)}</h3><small>表达加练 · ${step+1} / 5</small></div><button class="textbtn" onclick="App.practiceOutline()">练习顺序</button></div><div class="path">${practiceTasks.map((t,i)=>`<span class="${i<step?'done':i===step?'active':''}"></span>`).join('')}</div></header><div class="scroll"><span class="pill">${step<3?'同一句，逐步撤掉提示':'换个语境，继续用这个表达'}</span><h2 class="space">${practiceTasks[step]}</h2><p class="muted space" style="font-size:13px">${['听示范，留意连读和停顿，再完整跟读一次。','根据中文，把英文空缺部分补充完整。','现在不看英文，按中文提示说出完整句子。','还是这个表达，换成另一件事，完整说出来。','再换一个语境，尝试独立组织完整表达。'][step]}</p>${sourceMarkup(sentence)}<div class="card"><small>句子 ${step<3?1:step-1} · 中文提示</small><p style="font-size:16px;line-height:1.8;color:var(--ink)">${sentence.cn}</p></div>${step===0?`<div class="hint"><small>跟读示范</small><p style="font-size:18px">${sentence.en}</p><button class="textbtn" onclick="App.practiceListen()">▷ 听整句示范</button></div>`:step===1?`<div class="hint"><small>补全目标表达</small><p style="font-size:17px;line-height:1.8">${sentence.cloze}</p></div>`:''}${practiceFeedback?`<div class="card"><small>你的作答${practiceAttempt.sim?' · 模拟':''}</small><p style="color:var(--ink)">${escape(practiceAttempt.text)}</p></div><div class="hint"><small>${step===1?'空缺参考':'整句参考'} · 未做 AI 评分</small><p>${step===1?sentence.fill:sentence.en}</p><button class="textbtn" onclick="App.practiceListen()">▷ 听完整示范</button></div><p class="footnote">对照含义与目标表达。此原型不检测发音，也不判断语法或掌握程度。</p>`:step>1?'<div class="guide">先自己说一次。提交后再显示英文参考。</div>':''}</div><div class="composer">${practiceFeedback?`<button class="primary" onclick="App.practiceNext()">${step===4?'完成这组练习 →':'下一步：'+practiceTasks[step+1]+' →'}</button><button class="textbtn" style="width:100%" onclick="App.practiceRetry()">这一步再试一次</button>`:`<div class="inputrow"><textarea id="practiceinput" aria-label="表达加练作答" placeholder="${step===1?'输入空缺部分…':'用文字代替口头作答…'}" oninput="App.practiceDraft(this.value)">${escape(practiceDraft)}</textarea><button class="send" aria-label="提交加练作答" onclick="App.practiceSubmit()">↑</button></div><button class="primary space" onclick="App.practiceSubmit(true)">${step===0?'模拟跟读完成':step===1?'模拟补全答案':'模拟口头作答'}</button><small style="display:block;text-align:center;margin:7px 0">交互演示 · 未接入录音或语音评测</small>`}</div>`}
function practiceSubmit(sim=false){const sentence=practiceSentence(),step=practiceStore[practiceKey].step;if(!sentence)return;const text=sim?(step===1?sentence.fill:sentence.en):practiceDraft.trim();if(!text)return notify('先输入作答，或使用模拟作答');practiceAttempt={text,sim,step};practiceFeedback=true;render()}
function practiceNext(){if(!practiceFeedback)return;const state=practiceStore[practiceKey];state.attempts[state.step]=practiceAttempt;state.step++;practicePersist();practiceDraft='';practiceFeedback=false;practiceAttempt=null;render()}
function practiceRetry(){practiceFeedback=false;practiceDraft='';render()}
function practiceBack(){close();view=practiceReturn;render()}
function practiceRestart(){practiceStore[practiceKey]={step:0,attempts:[]};practicePersist();practiceFeedback=false;practiceDraft='';render()}
function practiceOutline(){sheet(`<h2>围绕一个表达，练五步</h2>${practiceTasks.map((t,i)=>`<div class="check"><span class="n">${i+1}</span><b>${t}</b></div>`).join('')}<p class="muted">前 3 步使用同一句，后 2 步分别使用新句子。</p><button class="primary space" onclick="App.close()">继续加练</button>`)}
function practiceListen(){if(!('speechSynthesis'in window))return notify('当前环境不支持合成朗读');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(practiceSentence().en);u.lang='en-US';u.rate=.85;u.onerror=()=>notify('朗读不可用，请查看文字');speechSynthesis.speak(u)}
function listen(){if(!('speechSynthesis'in window))return notify('当前环境不支持合成朗读');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(expected());u.lang='en-US';u.rate=.88;u.onerror=()=>notify('朗读不可用，请查看文字');speechSynthesis.speak(u)}
const curriculum=[{"id": "invite", "theme": "social", "title": "邀请邻居来家里坐坐", "group": "发出邀请", "context": "周五傍晚，你在楼道碰到邻居 Milo，想邀请他参加周末的小聚会。", "focus": "come over", "goal": "自然发出邀请", "rows": [{"q": "Hey! Any plans for the weekend?", "zh": "嗨！周末有什么安排吗？", "A1": {"en": "Can you come over on Saturday?", "cn": "你周六能来我家吗？"}, "A2": {"en": "We're having a few people over on Saturday. Do you want to come over?", "cn": "我们周六请了几个人来家里坐坐。你想来吗？"}, "teach": "come over 在这里是“来我家坐坐”。比只说 come 更清楚地交代了来哪里；邀请熟人时 Do you want to…? 很自然。", "teachA1": "come over 表示“来家里坐坐”。Can you…? 在这里用来发出一个简单邀请。"}, {"q": "That sounds nice! Is it a big party?", "zh": "听起来不错！是个大聚会吗？", "A1": {"en": "No, just a few friends.", "cn": "不是，就几个朋友。"}, "A2": {"en": "Nothing big—just a few friends, some food, and a bit of music.", "cn": "没什么大阵仗，就几个朋友，吃点东西，放点音乐。"}, "teach": "Nothing big 是接话时很自然的省略说法，意思是“没什么大阵仗”。后面补两三个细节，对方就能想象聚会的样子。", "teachA1": "just a few 是“就几个”，直接回应聚会大不大的问题。"}, {"q": "Nice. Can I bring my partner?", "zh": "不错。我可以带伴侣来吗？", "A1": {"en": "Of course! See you both on Saturday.", "cn": "当然！周六见你们俩。"}, "A2": {"en": "Of course! The more, the merrier. It'll be nice to meet them.", "cn": "当然！人多更热闹。很高兴能认识一下你的伴侣。"}, "teach": "Of course! 先爽快回应。The more, the merrier 是可以整块记住的社交表达：“人多更热闹”。them 在这里可以指对方未说明性别的伴侣。", "teachA1": "Of course! 表示爽快答应；both 指你和伴侣两个人。"}], "extra": [["你今天下班后想来我家坐坐吗？", "Do you want to come over after work today?"], ["我们能不能改成周日去你家？周六我们没空。", "Can we come over on Sunday instead? We're busy on Saturday."]]}, {"id": "time", "theme": "social", "title": "说清时间，确认人数", "group": "敲定安排", "context": "Milo 已经接受邀请，接着确认几点到，以及还有谁一起来。", "focus": "around six", "goal": "说明大致时间", "rows": [{"q": "What time should we come?", "zh": "我们几点来比较好？", "A1": {"en": "Come around six.", "cn": "六点左右来吧。"}, "A2": {"en": "Come around six. We'll probably eat a little later.", "cn": "六点左右来吧。我们可能稍晚一点开饭。"}, "teach": "around six 表示“六点左右”，给聚会留出一点时间余地。should we…? 在这里是在问对方的安排。", "teachA1": "around six 是“六点左右”，不用把时间说得很死。"}, {"q": "Okay. Is half past six too late?", "zh": "好的。六点半会不会太晚？", "A1": {"en": "No, that's fine.", "cn": "不会，没问题。"}, "A2": {"en": "Not at all. There's no rush—we'll save you some food.", "cn": "一点也不晚。不用赶，我们会给你们留点吃的。"}, "teach": "There's no rush 是“不着急”，适合安抚对方，不只是回答一个 yes 或 no。", "teachA1": "That’s fine 表示这个安排没问题，是很常用的回应。"}, {"q": "Great. My sister might be with us. Is that okay?", "zh": "太好了。我妹妹可能也跟我们一起，可以吗？", "A1": {"en": "Sure. So, three people?", "cn": "当然。所以一共三个人，对吗？"}, "A2": {"en": "Sure! So that's three of you, right? I'll put out an extra chair.", "cn": "当然！所以你们一共三个人，对吗？我再多放一把椅子。"}, "teach": "So that’s… right? 用来顺势核对信息。确认人数后说明自己会做什么，让回应更完整。", "teachA1": "Sure 先答应，再用 So…? 核对人数。短短一句也能确认关键信息。"}], "extra": [["我们六点左右在车站见面吧。", "Let's meet at the station around six."], ["我大概六点到家。你能晚一点打给我吗？", "I'll be home around six. Can you call me a bit later?"]]}, {"id": "bring", "theme": "social", "title": "商量带什么，照顾饮食偏好", "group": "准备聚会", "context": "Milo 想带点东西来，你们一起安排食物和饮料。", "focus": "bring something", "goal": "商量要带的东西", "rows": [{"q": "I'm going to the store. Do we need anything for Saturday?", "zh": "我要去商店。周六还需要什么吗？", "A1": {"en": "Can you bring something to drink?", "cn": "你能带点喝的吗？"}, "A2": {"en": "Could you bring something to drink? I've got the food covered.", "cn": "你能带点喝的吗？吃的我来准备。"}, "teach": "I've got the food covered 是“吃的我来负责”。比机械地逐项列出安排更像日常协作。", "teachA1": "something to drink 是“喝的东西”，可以先不指定是哪种饮料。"}, {"q": "Sure. Is juice okay?", "zh": "当然。果汁可以吗？", "A1": {"en": "Juice is great. Thanks!", "cn": "果汁很好。谢谢！"}, "A2": {"en": "Juice would be great. A couple of people don't drink alcohol.", "cn": "果汁就很好。有几个人不喝酒。"}, "teach": "would be great 是对建议的自然回应，语气柔和。再补一个原因，对方就知道为什么这个选择合适。", "teachA1": "…is great 在这里表示这个选择很好，再用 Thanks 表达感谢。"}, {"q": "Good to know. My partner doesn't eat meat, by the way.", "zh": "知道了。对了，我伴侣不吃肉。", "A1": {"en": "No problem. We have salad, too.", "cn": "没问题。我们也有沙拉。"}, "A2": {"en": "Thanks for letting me know. I'll make sure there's something for them.", "cn": "谢谢你告诉我。我会确保有适合他们吃的东西。"}, "teach": "Thanks for letting me know 先回应对方提供的信息；make sure 表示“确保”，适合表达你会照顾到这个需求。", "teachA1": "No problem 先让对方放心，too 表示也有另外一个选择。"}], "extra": [["明天你能带点吃的吗？", "Can you bring something to eat tomorrow?"], ["我们去公园吧。你可以带点喝的，我带零食。", "Let's go to the park. You can bring something to drink, and I'll bring snacks."]]}, {"id": "rain", "theme": "social", "title": "天气有变，改在室内聚", "group": "应对变化", "context": "原定在院子里的聚会遇到降雨预报，你要通知 Milo 新安排。", "focus": "move it inside", "goal": "提出替代安排", "rows": [{"q": "Have you seen the weather for Saturday? It might rain.", "zh": "你看周六的天气了吗？可能会下雨。", "A1": {"en": "Let's move it inside.", "cn": "我们把聚会改到室内吧。"}, "A2": {"en": "Let's move it inside if it rains. There's plenty of room in the living room.", "cn": "要是下雨，我们就改在室内吧。客厅地方很宽敞。"}, "teach": "move it inside 用 it 接住前面说的聚会，不用重复 party。if it rains 说明什么时候启用这个备选安排。", "teachA1": "move it inside 是“把活动改到室内”，it 指刚才讨论的聚会。"}, {"q": "Good idea. Are we still starting at six?", "zh": "好主意。还是六点开始吗？", "A1": {"en": "Yes, same time.", "cn": "对，时间不变。"}, "A2": {"en": "Yep, same time. We're just changing the place, not the plan.", "cn": "对，时间不变。我们只是换个地方，计划照旧。"}, "teach": "Yep, same time 是简短、自然的确认。说清什么变了、什么没变，能减少对方的不确定。", "teachA1": "same time 表示时间不变，口语里可以不用完整长句。"}, {"q": "Perfect. Should I tell my sister?", "zh": "好极了。需要我告诉我妹妹吗？", "A1": {"en": "Yes, please. See you Saturday!", "cn": "麻烦你了。周六见！"}, "A2": {"en": "Yes, please. And don't worry about bringing extra chairs—we're all set.", "cn": "麻烦你了。另外不用再带椅子了，我们都准备好了。"}, "teach": "We're all set 在这里指“都准备好了”，是安排妥当后常见的收尾表达。", "teachA1": "Yes, please 是接受帮助的礼貌回应。See you Saturday 自然约定下次见面。"}], "extra": [["外面太冷了。我们把活动改到室内吧。", "It's too cold outside. Let's move it inside."], ["如果晚饭前开始下雨，我们就把聚会改到室内。", "If it starts raining before dinner, we'll move it inside."]]}, {"id": "checkin", "theme": "travel", "title": "到达酒店，办理入住", "group": "抵达酒店", "context": "你刚到酒店前台，准备确认预订并办理入住。", "focus": "under my name", "goal": "说明预订姓名", "rows": [{"q": "Hi there. Checking in?", "zh": "你好。办理入住吗？", "A1": {"en": "Yes. It's under my name, Alex Lee.", "cn": "是的。用我的名字 Alex Lee 订的。"}, "A2": {"en": "Yes, I've got a booking under my name, Alex Lee.", "cn": "是的，我用自己的名字 Alex Lee 订了房。"}, "teach": "under my name 指预订登记在自己的名下。前台已问明来意后，可以直接接住问题回答。", "teachA1": "under my name 表示用自己的名字预订。前台已经问是否入住，直接回答 Yes 就能接上。"}, {"q": "Thanks. Can I see your passport?", "zh": "谢谢。可以看一下你的护照吗？", "A1": {"en": "Sure. Here you go.", "cn": "当然。给你。"}, "A2": {"en": "Sure, here you go. We're staying for two nights.", "cn": "当然，给你。我们住两晚。"}, "teach": "递东西时用 Here you go 很自然。不是逐字翻译“这里是我的护照”，而是边做动作边回应。", "teachA1": "Here you go 是把东西递给别人时常用的说法。"}, {"q": "Great. Your room is ready. Do you need two keys?", "zh": "好的。房间准备好了。需要两张房卡吗？", "A1": {"en": "Yes, please. Thanks!", "cn": "需要，麻烦了。谢谢！"}, "A2": {"en": "Two would be great, thanks. What floor are we on?", "cn": "两张就好，谢谢。我们住几楼？"}, "teach": "Two would be great 省略了已知的 keys；What floor are we on? 顺势问清下一步需要的信息。", "teachA1": "Yes, please 用来礼貌接受对方提供的东西。"}], "extra": [["这张桌子是用我的名字预订的。", "The table is booked under my name."], ["我用自己的名字订了两张票。你能帮我查一下吗？", "I've got two tickets under my name. Can you check for me?"]]}, {"id": "breakfast", "theme": "travel", "title": "问清早餐和退房时间", "group": "熟悉安排", "context": "拿到房卡后，你想确认第二天的早餐和退房安排。", "focus": "included", "goal": "确认是否包含", "rows": [{"q": "Here are your keys. Any questions?", "zh": "这是你的房卡。还有什么想问的吗？", "A1": {"en": "Is breakfast included?", "cn": "包含早餐吗？"}, "A2": {"en": "Is breakfast included, or do we pay for it separately?", "cn": "包含早餐吗，还是需要另外付费？"}, "teach": "included 表示已经包含。A2 里补上 or…，一次问清两种可能，避免来回确认。", "teachA1": "included 表示已经包含。这里是在问房费是否包含早餐。"}, {"q": "Yes, it is. Breakfast is downstairs from seven to ten.", "zh": "包含的。早餐在楼下，七点到十点。", "A1": {"en": "Great. And what time is check-out?", "cn": "好的。另外几点退房？"}, "A2": {"en": "Great, thanks. And what time do we need to check out?", "cn": "好的，谢谢。另外我们需要几点退房？"}, "teach": "And… 可以自然接着问下一个相关问题；check out 作动词表示“退房”。", "teachA1": "And 引出下一个相关问题。check-out 作名词表示退房。"}, {"q": "Eleven. But we can keep your bags if you're leaving later.", "zh": "十一点。不过如果你们晚点走，我们可以寄存行李。", "A1": {"en": "That's great. Thank you.", "cn": "那太好了。谢谢。"}, "A2": {"en": "That would be really helpful. Our train isn't until three.", "cn": "那可真帮大忙了。我们的火车三点才开。"}, "teach": "isn't until three 表示“直到三点才……”，强调还早；补充原因也回应了对方为什么寄存行李有帮助。", "teachA1": "That’s great 表示对安排很满意，适合接住对方提供的帮助。"}], "extra": [["这个价格包含饮料吗？", "Are drinks included in the price?"], ["门票包含导览吗，还是需要另外付费？", "Is the tour included, or do we pay extra?"]]}, {"id": "directions", "theme": "travel", "title": "请前台推荐附近餐馆", "group": "探索周边", "context": "安顿好后，你想找一家不用走太远的餐馆。", "focus": "nearby", "goal": "询问附近的选择", "rows": [{"q": "Heading out for dinner?", "zh": "准备出去吃晚饭吗？", "A1": {"en": "Yes. Is there a good restaurant nearby?", "cn": "是的。附近有不错的餐馆吗？"}, "A2": {"en": "Yeah. Is there somewhere good to eat nearby? Nothing too expensive.", "cn": "对。附近有什么好吃的地方吗？别太贵就好。"}, "teach": "somewhere good to eat 是“吃饭的好地方”。Nothing too expensive 补上偏好，简短又自然。", "teachA1": "nearby 表示附近，不需要在它后面再补 here。"}, {"q": "There's a little noodle place around the corner.", "zh": "拐角有家小面馆。", "A1": {"en": "Sounds good. Is it far?", "cn": "听着不错。远吗？"}, "A2": {"en": "Sounds good. Can we walk there, or should we take a taxi?", "cn": "听着不错。可以走过去，还是要打车？"}, "teach": "Sounds good 先接住建议，再问路程；这样比只抛出下一道问题更像交流。", "teachA1": "Sounds good 接受建议，Is it far? 接着问远不远。"}, {"q": "It's a five-minute walk. Turn left when you go out.", "zh": "步行五分钟。出门左转。", "A1": {"en": "Left, then? Thanks!", "cn": "那就是左转，对吧？谢谢！"}, "A2": {"en": "Left when we go out—got it. Thanks for the tip!", "cn": "出门左转，知道了。谢谢推荐！"}, "teach": "got it 表示“明白了”。Thanks for the tip 是感谢有用的建议，不是感谢小费。", "teachA1": "重复方向并用疑问语气核对，是没把握时很好用的确认方法。"}], "extra": [["附近有药店吗？", "Is there a pharmacy nearby?"], ["我们有一个小时的空闲。附近有安静的地方可以坐坐吗？", "We've got an hour. Is there somewhere quiet to sit nearby?"]]}, {"id": "checkout", "theme": "travel", "title": "退房并寄存行李", "group": "结束入住", "context": "离开房间后，你想先寄存行李，再去附近逛逛。", "focus": "leave our bags", "goal": "提出寄存请求", "rows": [{"q": "Good morning. Are you checking out?", "zh": "早上好。要退房吗？", "A1": {"en": "Yes. Can we leave our bags here?", "cn": "是的。我们能把行李寄存在这里吗？"}, "A2": {"en": "Yes. Could we leave our bags here for a few hours? Our train's at three.", "cn": "是的。我们能把行李寄存几小时吗？火车三点开。"}, "teach": "leave our bags here 直接说明需求。加上 for a few hours 和原因，让对方容易安排。", "teachA1": "Can we…? 礼貌提出请求。leave our bags here 是把行李暂时留在这里。"}, {"q": "Of course. What time will you be back?", "zh": "当然。你们几点回来？", "A1": {"en": "Around two.", "cn": "大概两点。"}, "A2": {"en": "Around two, if that's okay. We just want to grab some lunch.", "cn": "大概两点，可以的话。我们只是想去吃个午饭。"}, "teach": "grab some lunch 是比较随意的“吃点午饭”；if that’s okay 给对方确认的空间。", "teachA1": "around two 是大约两点，用一个时间短语直接回答就可以。"}, {"q": "No problem. Keep this ticket and show it when you come back.", "zh": "没问题。留好这张票，回来时出示。", "A1": {"en": "Okay, thanks for your help.", "cn": "好的，谢谢你帮忙。"}, "A2": {"en": "Got it. Thanks for your help—we've had a lovely stay.", "cn": "明白了。谢谢你的帮助，我们住得很愉快。"}, "teach": "结束服务时用一句具体感受收尾，比重复 thank you 更有温度。", "teachA1": "Thanks for your help 是对具体帮助表示感谢。"}], "extra": [["我们能把行李放在车里吗？", "Can we leave our bags in the car?"], ["房间还没准备好。我们可以先把行李放在这里，晚点再来吗？", "Our room isn't ready. Can we leave our bags here and come back later?"]]}, {"id": "meet", "theme": "work", "title": "认识同事，介绍自己", "group": "开始熟悉团队", "context": "入职第一天，你在办公室遇到 Milo。", "focus": "just started", "goal": "说明刚入职", "rows": [{"q": "Hi! I don't think we've met. I'm Milo.", "zh": "你好！我们好像还没见过。我叫 Milo。", "A1": {"en": "Hi, I'm Alex. I just started today.", "cn": "你好，我是 Alex。我今天刚入职。"}, "A2": {"en": "Hi, I'm Alex. I just started today, so I'm still finding my way around.", "cn": "你好，我是 Alex。我今天刚入职，还在熟悉环境。"}, "teach": "just started 表示“刚开始”。finding my way around 在这里是熟悉办公室环境，不只是在找路。", "teachA1": "just started 表示刚开始。加上 today，就能说明今天刚入职。"}, {"q": "Welcome! Which team are you on?", "zh": "欢迎！你在哪个团队？", "A1": {"en": "I'm on the design team.", "cn": "我在设计团队。"}, "A2": {"en": "I'm on the design team. I'll be working with Sam.", "cn": "我在设计团队，之后会和 Sam 一起工作。"}, "teach": "on the… team 是常见的团队归属说法。补上同事名字，让对方更容易建立联系。", "teachA1": "on the design team 表示属于设计团队，是介绍工作时常用的搭配。"}, {"q": "Sam's great. Let me know if you need anything.", "zh": "Sam 很好相处。有什么需要跟我说。", "A1": {"en": "Thanks! Where's the kitchen?", "cn": "谢谢！茶水间在哪里？"}, "A2": {"en": "Thanks, I will. Actually, could you show me where the kitchen is?", "cn": "谢谢，我会的。对了，你能带我看看茶水间在哪吗？"}, "teach": "Actually 在这里自然引出眼下的小请求。Thanks, I will 先回应对方的好意。", "teachA1": "Thanks 先回应好意，再问一个具体问题。Where’s 是 Where is 的缩写。"}], "extra": [["我刚开始学西班牙语。", "I just started learning Spanish."], ["我刚开始新工作，所以还在习惯这个作息。", "I just started a new job, so I'm still getting used to the routine."]]}, {"id": "clarify", "theme": "work", "title": "没听清时，请对方再说一次", "group": "听懂与确认", "context": "Milo 在说明一个小任务，你需要问清地点和时间。", "focus": "say that again", "goal": "礼貌请求重复", "rows": [{"q": "Could you take these to the meeting room after lunch?", "zh": "午饭后你能把这些送到会议室吗？", "A1": {"en": "Sorry, can you say that again?", "cn": "不好意思，你能再说一次吗？"}, "A2": {"en": "Sorry, could you say that again? I didn't catch the last part.", "cn": "不好意思，你能再说一次吗？我没听清最后那部分。"}, "teach": "I didn't catch… 表示“没听清……”。点明没听清哪里，对方就不用全部重说。", "teachA1": "Sorry 先礼貌打断，can you say that again 请求对方再说一次。"}, {"q": "The meeting room. The one next to the kitchen.", "zh": "会议室，茶水间旁边那间。", "A1": {"en": "Next to the kitchen?", "cn": "茶水间旁边，对吗？"}, "A2": {"en": "The one next to the kitchen, right? Not the big room upstairs?", "cn": "茶水间旁边那间，对吧？不是楼上那间大的？"}, "teach": "用 right? 核对理解，同时排除另一个可能，比假装听懂更能保证沟通完成。", "teachA1": "重复听到的地点，并用疑问语气确认，比假装听懂更稳妥。"}, {"q": "That's right. Anytime before two is fine.", "zh": "对。两点前都可以。", "A1": {"en": "Okay. I'll do it after lunch.", "cn": "好的。我午饭后去送。"}, "A2": {"en": "Got it. I'll take them over after lunch, before two.", "cn": "明白了。我午饭后、两点前送过去。"}, "teach": "用自己的话复述行动和时间，既确认听懂，也让对方放心。", "teachA1": "I’ll 是 I will 的缩写，表示自己接下来会做的事。"}], "extra": [["不好意思，你能再说一次地址吗？", "Sorry, can you say that again—the address?"], ["这里有点吵。你能再说一次吗？我没听清时间。", "It's a bit noisy here. Could you say that again? I missed the time."]]}, {"id": "lunch", "theme": "work", "title": "加入同事的午餐安排", "group": "日常接话", "context": "午饭时间，同事邀请你一起出去吃饭。", "focus": "sounds good", "goal": "自然接受建议", "rows": [{"q": "We're going out for lunch. Want to join us?", "zh": "我们要出去吃午饭。要一起吗？", "A1": {"en": "Sounds good. Where are we going?", "cn": "好啊。我们去哪吃？"}, "A2": {"en": "Sounds good! I was just thinking about lunch. Where are you heading?", "cn": "好啊！我正想着吃午饭呢。你们打算去哪？"}, "teach": "Sounds good 是接受建议的自然说法；I was just thinking… 表达“我也正好有这个想法”。", "teachA1": "Sounds good 是接受邀请或建议时很自然的说法。"}, {"q": "There's a sandwich place downstairs. Is that okay?", "zh": "楼下有家三明治店，可以吗？", "A1": {"en": "Sure. I like sandwiches.", "cn": "当然。我喜欢三明治。"}, "A2": {"en": "Sure, that works for me. Do they have anything without meat?", "cn": "当然，我没问题。他们有没有不放肉的？"}, "teach": "That works for me 表示安排对自己合适，接着说明饮食需求，简洁又礼貌。", "teachA1": "Sure 表示同意，再用一句简单偏好接话。"}, {"q": "Yeah, they've got a good cheese one. Ready to go?", "zh": "有，他们的芝士三明治不错。可以走了吗？", "A1": {"en": "One minute. I'll get my coat.", "cn": "等我一分钟。我拿一下外套。"}, "A2": {"en": "Give me a minute—I'll just grab my coat, and I'm ready.", "cn": "给我一分钟，我拿一下外套就好了。"}, "teach": "grab my coat 是“拿上外套”的随意说法；just 表示只是一个很快的小动作。", "teachA1": "One minute 表示稍等片刻，I’ll get my coat 说明自己要做什么。"}], "extra": [["六点见？好啊！", "Meet at six? Sounds good!"], ["先喝杯咖啡再去逛？听起来不错，我正好需要歇一会儿。", "Coffee before shopping? Sounds good. I could use a break."]]}, {"id": "update", "theme": "work", "title": "简短汇报进度，说明下一步", "group": "协作沟通", "context": "Milo 询问你负责的小任务进展，你需要说明完成情况。", "focus": "almost done", "goal": "汇报当前进度", "rows": [{"q": "Hey, how is the list coming along?", "zh": "嗨，那份清单做得怎么样了？", "A1": {"en": "I'm almost done.", "cn": "我快做完了。"}, "A2": {"en": "I'm almost done. I just need to check a couple of names.", "cn": "我快做完了，只需要再核对几个名字。"}, "teach": "almost done 是“快完成了”。再补剩下什么，对方更容易判断进展。", "teachA1": "almost done 表示快做完了，适合简短汇报进度。"}, {"q": "Great. Can you send it before lunch?", "zh": "太好了。午饭前能发给我吗？", "A1": {"en": "Yes. I'll send it by twelve.", "cn": "可以。我十二点前发给你。"}, "A2": {"en": "Sure. I'll send it over by twelve. Does that work for you?", "cn": "当然。我十二点前发过去，这个时间你方便吗？"}, "teach": "by twelve 是“最晚十二点”，不是“十二点左右”。Does that work for you? 用来确认安排合适。", "teachA1": "by twelve 是最晚十二点，和 at twelve 的十二点整不同。"}, {"q": "Perfect. Let me know if you need a hand.", "zh": "好极了。需要帮忙就跟我说。", "A1": {"en": "Thanks. Can you check this name?", "cn": "谢谢。你能核对一下这个名字吗？"}, "A2": {"en": "Thanks! Actually, could you check this name for me? I'm not sure I've got it right.", "cn": "谢谢！对了，你能帮我核对一下这个名字吗？我不确定有没有写对。"}, "teach": "need a hand 是“需要帮忙”。具体提出一个小请求，比笼统说自己不会更容易获得帮助。", "teachA1": "Can you check…? 用于请求别人帮忙核对具体信息。"}], "extra": [["我快做完了。给我五分钟。", "I'm almost done. Give me five minutes."], ["我们快打包好了，只剩下厨房的东西了。", "We're almost done packing. There's just the kitchen stuff left."]]}];

function setupChoose(i){setupSend((setupStep===1?contextChoices():setupQs[setupStep].choices)[i])}
function setupSend(text){if(setupStep>=5||setupBusy)return;const t=(text||setupDraft).trim();if(!t)return notify('告诉我一点你的情况，或选一个回答');let ack='';
if(setupStep===0){let theme=/邻|朋友|社交|日常|聚会/.test(t)?'social':/旅|酒店|住|出国/.test(t)?'travel':/职|同事|工作|办公/.test(t)?'work':null;if(!theme)return notify('本次演示先支持日常社交、旅行出行、职场交流，请选最接近的一类');setupAnswers.theme=theme;setupAnswers.topic=t;ack='好，我们从'+themes[theme].tag+'开始。'}

if(setupStep===4){let mins=/10|十/.test(t)?'10 分钟':/5|五/.test(t)?'5 分钟':null;if(!mins)return notify('这版可以演示每次 5 分钟或 10 分钟的安排');setupAnswers.time=mins;ack='好，每次先安排'+(mins.includes('10')?'两个':'一个')+'小任务。'}
setupLog.push({role:'ai',text:setupQs[setupStep].ask},{role:'user',text:t},{role:'coach',text:ack});setupDraft='';if(setupEditing&&setupStep===0){setupStep=1}else if(setupEditing){setupEditing=false;setupStep=5}else setupStep++;render()}
function setupEdit(step){setupStep=step;setupEditing=true;setupDraft='';setupBusy=false;render()}
function setupLeave(){setupToken++;setupBusy=false;if(profile.done){home()}else notify('先聊几句，我才能安排适合你的课程')}
function generatePlan(){if(setupBusy)return;setupBusy=true;render();const tk=++setupToken;setTimeout(()=>{if(tk!==setupToken)return;profile={done:true,level:setupAnswers.level,self:setupAnswers.level,topics:[themes[setupTheme()].tag],theme:setupTheme(),goal:setupAnswers.goal,context:setupAnswers.context,time:setupAnswers.time,topic:setupAnswers.topic};persistProfile();setupBusy=false;activeTheme=profile.theme;view='plan';render()},1100)}
function themeOrder(){return [profile.theme||'social',...Object.keys(themes).filter(k=>k!==profile.theme&&k!==(profile.theme?'':'social'))]}
function taskOrder(theme){let list=curriculum.filter(u=>u.theme===theme);if(theme!==profile.theme)return list;const ctx=profile.context||'',goal=profile.goal||'';let priority=/变化/.test(goal)?{social:'rain',travel:'checkout',work:'clarify'}[theme]:/已经约好|食物/.test(ctx)?'bring':/早餐|寄存/.test(ctx)?'breakfast':/没听清|进度/.test(ctx)?'clarify':list[0].id;return [...list.filter(u=>u.id===priority),...list.filter(u=>u.id!==priority)]}
function homeMarkup(){return `<div class="recommend-head"><div class="row between"><h2>为你推荐</h2><button class="circle" aria-label="和教练重新安排课程" onclick="App.onboard()">≈</button></div><div class="filterbar"><button onclick="App.changeLevel()">难度 · ${selectedLevel()} ⌄</button><button onclick="App.onboard()">内容 · ${themes[profile.theme||'social'].tag} ⌄</button></div><small>按你的基础、目标与使用场景编排</small></div><div class="scroll scene-scroll"><div class="scene-grid">${themeOrder().map((k,i)=>{const t=themes[k];return `<button class="scene-tile" onclick="App.openTheme('${k}')"><div class="scene-art ${t.color}"><i></i><span>${t.icon}</span><b>${selectedLevel()}</b></div><div class="tile-body"><small>${i===0?'为你优先安排':'也可以试试'}</small><h3>${t.title}</h3><span class="topic-tag">${t.tag} · 4 个细场景</span><p>${t.desc}</p></div></button>`}).join('')}</div><p class="footnote">A1 / A2 为语料设计档位，不是正式水平测评。全部细场景均可体验。</p></div>${nav()}`}

function planMarkup(){const t=themes[activeTheme],list=taskOrder(activeTheme),lv=selectedLevel(),count=list.filter(u=>doneUnits[u.id+'-'+lv]).length;return `<header class="header"><div class="row between"><button class="back" onclick="App.home()">‹</button><div><h3>你的主题课程</h3><small>${lv} · 每个任务约 5—7 分钟</small></div><button class="textbtn" onclick="App.changeLevel()">调难度</button></div></header><div class="scroll"><span class="pill">${activeTheme===profile.theme?'根据你的回答编排':'拓展主题'} · ${t.tag}</span><h1 class="space">${t.title}</h1><p class="muted space" style="font-size:13px">${t.desc}</p>${activeTheme===profile.theme?`<div class="guide"><b>你想做到</b><p>${escape(profile.goal||'完成日常交流')}</p><small>使用场景：${escape(profile.context||'日常生活')}<br>${profile.time||'5 分钟'}一次 · 本次建议 ${profile.time?.includes('10')?'2':'1'} 个任务</small></div>`:''}<div class="row between section"><b>具体会练什么</b><small>${count} / ${list.length} 已练习</small></div>${list.map((u,i)=>`<div class="unit-group">${i===0||list[i-1].group!==u.group?`<small class="unit-group-title">${u.group}</small>`:''}<button class="unit-button" onclick="App.openLesson('${u.id}')"><span class="unit-index">${doneUnits[u.id+'-'+lv]?'✓':String(i+1).padStart(2,'0')}</span><div><b>${u.title}</b><small>${u.goal} · ${u.rows.length} 轮对话</small></div><span>›</span></button></div>`).join('')}<p class="footnote">推荐顺序可调整，不锁关。练习完成不等于已掌握。</p></div>${nav()}`}

function onboard(){cancel();setupToken++;setupStep=0;keyboardMode=false;setupLog=[{role:'ai',text:'嗨，很高兴见到你！我是白狼，你的 AI 口语教练。'},{role:'ai',text:'我会陪你在真实情景里练习：先试着说，再一起看看怎样说得更准确、更自然。卡住时也没关系，我会给你提示。先聊聊你的兴趣和基础，我来帮你安排练习。'}];setupAnswers={};selectedSubs=[];setupDraft='';setupBusy=false;setupEditing=false;close();view='setup';render()}
function contextChoices(){return broadTopics[setupAnswers.broad||'daily'].items}
function setupBubble(m){return `<article class="msg ${m.role==='user'?'user':'ai'}"><div class="bubble">${escape(m.text)}</div></article>`}
function setupMarkup(){const summary=setupStep===5;return `${coachHeader('App.setupLeave()')}<div class="scroll chatlog" id="log">${setupLog.map(setupBubble).join('')}${summary?`${setupBubble({text:'我整理好了：从你感兴趣的情景出发，把每个方向拆成连贯的小任务。看看这些信息是否准确。'})}<div class="plan-brief">${[['大方向',setupAnswers.topic],['想学的情景',setupAnswers.context],['起点',setupAnswers.level+' · 自评'],['每次投入',setupAnswers.time]].map((x,i)=>`<div class="brief-row"><div><small>${x[0]}</small><p>${escape(x[1]||'')}</p></div><button onclick="App.setupEdit(${[0,1,2,4][i]})">修改</button></div>`).join('')}<p class="footnote">会为你保留全部已选方向。先练完成交流，再补充细节、表达原因、自然接话。</p></div>${setupBusy?'<div class="generation"><span class="spinner"></span><b>正在整理学习计划…</b></div>':''}`:setupBubble({text:setupQs[setupStep].ask})}</div><div class="composer">${summary?`<button class="primary" ${setupBusy?'disabled':''} onclick="App.generatePlan()">确认，生成课程并添加计划 →</button><small class="setup-note">演示版按选择编排预置内容；自由补充会保留在计划中</small>`:`<div class="setup-choices">${(setupStep===1?contextChoices():setupQs[setupStep].choices).map((t,i)=>`<button class="${setupStep===1&&selectedSubs.includes(t)?'chosen':''}" aria-pressed="${setupStep===1&&selectedSubs.includes(t)}" onclick="App.setupChoose(${i})">${setupStep===1?(selectedSubs.includes(t)?'✓ ':'＋ '):''}${escape(t)}</button>`).join('')}</div><div class="inputrow"><textarea id="setupinput" aria-label="补充你的需求" placeholder="${setupStep===1?'也可以补充其他情景…':'也可以直接输入你的想法…'}" oninput="App.setupDraft(this.value)">${escape(setupDraft)}</textarea><button class="send" aria-label="发送补充信息" onclick="App.setupSend()">↑</button></div>${setupStep===1?`<button class="primary space" onclick="App.confirmSubs()">选好了，继续${selectedSubs.length?' · '+selectedSubs.length+' 项':''} →</button>`:''}`}</div>`}
function setupChoose(i){if(setupStep===1){const t=contextChoices()[i];selectedSubs=selectedSubs.includes(t)?selectedSubs.filter(x=>x!==t):[...selectedSubs,t];render()}else setupSend(setupQs[setupStep].choices[i])}
function confirmSubs(){const custom=setupDraft.trim();if(custom&&!selectedSubs.includes(custom))selectedSubs.push(custom);if(!selectedSubs.length)return notify('可以选一个或多个情景，也可以直接补充');setupAnswers.subtopics=[...selectedSubs];setupAnswers.context=selectedSubs.join('、');setupAdvance(setupAnswers.context,'这些方向都记下了，我们会一起覆盖，不需要只选一个。')}
function setupAdvance(t,ack){setupLog.push({role:'ai',text:setupQs[setupStep].ask},{role:'user',text:t},{role:'ai',text:ack});setupDraft='';if(setupEditing&&setupStep===0){setupStep=1}else if(setupEditing){setupEditing=false;setupStep=5}else setupStep++;render()}
function setupSend(text){if(setupBusy||setupStep>=5)return;const t=(text||setupDraft).trim();if(!t)return notify('选择或输入你的想法');if(setupStep===1){if(!selectedSubs.includes(t))selectedSubs.push(t);setupDraft='';render();return notify('已补充，选好后点击继续')}let ack='记下了。';if(setupStep===0){const key=/兴趣|电影|音乐|运动|烹饪/.test(t)?'interests':/旅行|出游|酒店/.test(t)?'travel':/职场|工作|同事/.test(t)?'work':/日常|生活|社交/.test(t)?'daily':null;if(!key)return notify('先选最接近的一个大方向，下一步可以自由补充');setupAnswers.broad=key;setupAnswers.topic=broadTopics[key].name;setupAnswers.theme={daily:'social',travel:'travel',work:'work',interests:'movies'}[key];selectedSubs=[];ack='好，从'+broadTopics[key].name+'开始。'}if(setupStep===2){const lv=t.toUpperCase().match(/A1|A2|B1|B2/);if(!lv)return notify('请选择 A1、A2、B1 或 B2及以上');setupAnswers.level=lv[0]==='B2'?'B2及以上':lv[0];ack='先以 '+setupAnswers.level+' 为起点；这是一份自评，不是正式测评。'}if(setupStep===3){setupAnswers.goal=t;ack='每个任务都会围绕这个目标安排。'}if(setupStep===4){setupAnswers.time=t;ack='好，我把你的需求整理在一起，请最后确认。'}setupAdvance(t,ack)}
function setupEdit(step){setupStep=step;setupEditing=true;setupDraft='';selectedSubs=[...(setupAnswers.subtopics||[])];setupBusy=false;render()}
function generatePlan(){if(setupBusy)return;setupBusy=true;render();const tk=++setupToken;setTimeout(()=>{if(tk!==setupToken)return;profile={...setupAnswers,done:true,level:setupAnswers.level,self:setupAnswers.level,topics:setupAnswers.subtopics,theme:setupAnswers.theme};addedPlans.push({...profile,id:Date.now()});demoStore.setItem('coach-plans-v10',JSON.stringify(addedPlans));persistProfile();setupBusy=false;view='home';render();notify('学习计划已添加')},650)}

function speakEnglish(text,manual=false){if(!manual||!text)return;if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){if(manual)notify('当前浏览器不支持朗读，请换用支持语音合成的浏览器');return}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-US';utterance.rate=.9;const voices=speechSynthesis.getVoices();utterance.voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'))||null;utterance.onerror=e=>{if(e.error==='interrupted'||e.error==='canceled')return;if(manual||!audioNoticeShown){audioNoticeShown=true;notify('朗读暂不可用，请稍后重试')}};speechSynthesis.speak(utterance)}

function inputDock(context){const text=context==='setup'?setupDraft:context==='free'?freeDraft:draft,id=context==='setup'?'setupinput':context==='free'?'freeinput':'draft',method=context==='setup'?'setupDraft':context==='free'?'freeDraft':'draft',sendMethod=context==='setup'?'setupSend':context==='free'?'freeSend':'send',locked=context==='free'?freeBusy:context==='setup'?setupBusy:busy||stage>=frames.length;return `<div class="input-dock">${keyboardMode?`<div class="inputrow"><textarea id="${id}" aria-label="${context==='setup'?'补充你的需求':context==='free'?'自由聊天输入':'你的英文回复'}" placeholder="${context==='setup'?'说说你的想法…':'输入回复，或确认刚才说的内容…'}" oninput="App.${method}(this.value)">${escape(text)}</textarea><button class="send" aria-label="发送" ${locked?'disabled':''} onclick="App.${sendMethod}()">↑</button></div>`:''}<div class="voice-controls"><span class="voice-balance"></span><button class="mic-main ${voiceActive?'recording':''}" aria-label="${voiceActive?'结束说话':'开始说话'}" aria-pressed="${voiceActive}" ${locked?'disabled':''} onclick="App.toggleVoice()">${voiceActive?'<span class="stop-recording"></span>':micIcon}</button><button class="keyboard-switch ${keyboardMode?'selected':''}" aria-label="${keyboardMode?'收起键盘':'切换打字输入'}" aria-pressed="${keyboardMode}" onclick="App.toggleKeyboard()">${keyboardIcon}</button></div><small class="voice-caption">${voiceActive?'正在听，再点一下结束':keyboardMode?'也可以点击麦克风说话':'点击说话'}</small></div>`}

function toggleVoice(){if(voiceActive){voiceRecognition?.stop();return}const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){keyboardMode=true;render();notify('当前浏览器不支持语音识别，请使用打字输入');return}const context=view,session=++voiceSession;const rec=new Recognition();voiceRecognition=rec;rec.lang=context==='setup'?'zh-CN':'en-US';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=1;voiceActive=true;rec.onresult=e=>{if(session!==voiceSession||view!==context)return;let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;if(!t)return;if(context==='setup')setupDraft=t;else if(context==='free')freeDraft=t;else draft=t;keyboardMode=true;voiceActive=false;render();notify('已转为文字，确认后发送')};rec.onerror=e=>{if(session!==voiceSession)return;voiceActive=false;voiceRecognition=null;keyboardMode=true;render();notify(e.error==='not-allowed'?'麦克风权限未开启，可以使用打字输入':e.error==='no-speech'?'没有听清，请再试一次或打字输入':'语音识别暂不可用，请使用打字输入')};rec.onend=()=>{if(session!==voiceSession)return;voiceActive=false;voiceRecognition=null;render()};render();try{rec.start()}catch{voiceActive=false;voiceRecognition=null;keyboardMode=true;render();notify('无法开启麦克风，请使用打字输入')}}

function normalizedAnswer(t){return t.toLowerCase().replace(/[’‘]/g,"'").replace(/\bwe're\b/g,'we are').replace(/\bi'm\b/g,'i am').replace(/\bit's\b/g,'it is').replace(/\bi've\b/g,'i have').replace(/\bwe've\b/g,'we have').replace(/\bthat's\b/g,'that is').replace(/\bthere's\b/g,'there is').replace(/\bi'll\b/g,'i will').replace(/\bwe'll\b/g,'we will').replace(/\bdon't\b/g,'do not').replace(/[^a-z0-9]+/g,' ').trim()}

function highlightedSentence(text){const lower=text.toLowerCase().replace(/[’‘]/g,"'"),ranges=[];for(const phrase of [...learningPhrases].sort((a,b)=>b.length-a.length)){const needle=phrase.replace(/[’‘]/g,"'");const start=lower.indexOf(needle);if(start>=0&&!ranges.some(r=>start<r.end&&start+needle.length>r.start))ranges.push({start,end:start+needle.length})}ranges.sort((a,b)=>a.start-b.start);let result='',cursor=0;for(const [i,r] of ranges.slice(0,3).entries()){result+=escape(text.slice(cursor,r.start))+`<mark class="phrase-highlight tone-${i%3}">${escape(text.slice(r.start,r.end))}</mark>`;cursor=r.end}return result+escape(text.slice(cursor))}

function homeMarkup(){const subs=profile.subtopics||[];const lv=selectedLevel();return `<div class="recommend-head"><div class="row between"><div><h2>你的情景练习</h2></div><button class="circle" aria-label="添加学习计划" onclick="App.onboard()">＋</button></div><div class="filterbar"><button onclick="App.switchPlans()">${escape(profile.topic||'我的计划')} · ${lv} ⌄</button></div></div><div class="scroll scene-scroll course-list">${subs.map((sub,i)=>{const k=subMap[sub],t=themes[k],units=k?curriculum.filter(x=>x.theme===k):[],open=expandedTopics[i]??(i===0),done=units.filter(u=>doneUnits[u.id+'-'+lv]).length;return `<section class="course-section"><button class="course-heading" aria-expanded="${open}" aria-controls="course-${i}" onclick="App.toggleTopic(${i})"><span class="topic-icon ${t?.color||'sand'}">${t?.icon||'✦'}</span><span class="topic-copy"><strong>${escape(sub)}</strong><small>${units.length?`${units.length} 节情景小课 · 已练 ${done} 节`:'已加入计划 · 课程待生成'}</small></span><span class="expand-indicator">${open?'−':'＋'}</span></button><div id="course-${i}" ${open?'':'hidden'} class="course-body">${units.length?`<p class="course-description">${t.desc}</p><ol class="lesson-list">${units.map((u,j)=>`<li class="lesson-item"><button class="lesson-row" onclick="App.openLesson('${u.id}')"><span class="lesson-number ${doneUnits[u.id+'-'+lv]?'complete':''}">${doneUnits[u.id+'-'+lv]?'✓':String(j+1).padStart(2,'0')}</span><span><strong>${escape(u.title)}</strong><small>${u.capstone?'3 项自由表达任务':'5 轮情景对话'} · 约 5—7 分钟</small></span><span class="lesson-arrow">›</span></button><button class="lesson-notes" onclick="App.openKnowledge('${u.id}')" aria-label="查看课程知识点" title="课程知识点">▤</button></li>`).join('')}</ol>`:`<p class="course-description">这个方向已保留。连接模型服务后，将为你生成对应的小课。</p>`}</div></section>`}).join('')}<p class="footnote">各节小课可自由选择。当前 A1 / A2 有示例语料，其他难度等待生成。</p></div>${nav()}`}
function summaryMarkup(){if(isCapstone)return capstoneSummary();return `<header class="header row"><button class="back" aria-label="返回对话" onclick="App.backChat()">‹</button><b>本次收获</b></header><div class="scroll harvest-scroll"><div class="lesson-receipt"><small>${lessonLevel} · 本课收获</small><h2>${escape(activeUnit.title)}</h2><p>${frames.length} 轮情景练习 · ${harvestItems().length} 个重点表达</p></div><h3 class="harvest-heading">这次重点练过</h3>${harvestItems().map((item,i)=>{const saved=library.some(x=>x.key===item.key);return `<article class="harvest-expression"><div class="harvest-title"><h2>${escape(item.label)}</h2><button class="favorite-button ${saved?'saved':''}" aria-label="${saved?'取消收藏':'收藏表达'} ${escape(item.label)}" aria-pressed="${saved}" onclick="App.toggleHarvestFavorite(${i})">${saved?'★ 已收藏':'☆ 收藏'}</button></div><p class="harvest-example" lang="en">${highlightedSentence(item.example,[item.label])}</p><p class="harvest-translation">${escape(item.meaning)}</p></article>`}).join('')}</div><div class="composer"><button class="primary" onclick="App.continueLearning()">继续学习 →</button></div>`}
function inputDock(context){const text=context==='practice'?practiceDraft:context==='setup'?setupDraft:context==='free'?freeDraft:draft,id=context==='practice'?'practiceinput':context==='setup'?'setupinput':context==='free'?'freeinput':'draft',method=context==='practice'?'practiceDraft':context==='setup'?'setupDraft':context==='free'?'freeDraft':'draft',sendMethod=context==='practice'?'practiceSubmit':context==='setup'?'setupSend':context==='free'?'freeSend':'send',locked=context==='practice'?practiceFeedback:context==='free'?freeBusy:context==='setup'?setupBusy:busy||stage>=frames.length;return `<div class="input-dock">${keyboardMode?`<div class="inputrow"><textarea id="${id}" aria-label="${context==='setup'?'补充你的需求':context==='free'?'自由聊天输入':'你的英文回复'}" placeholder="${context==='setup'?'说说你的想法…':'输入回复，或确认刚才说的内容…'}" oninput="App.${method}(this.value)">${escape(text)}</textarea><button class="send" aria-label="发送" ${locked?'disabled':''} onclick="App.${sendMethod}()">↑</button></div>`:''}<div class="voice-controls"><span class="voice-balance"></span><button class="mic-main ${voiceActive?'recording':''}" aria-label="${voiceActive?'结束说话':'开始说话'}" aria-pressed="${voiceActive}" ${locked?'disabled':''} onclick="App.toggleVoice()">${voiceActive?'<span class="stop-recording"></span>':micIcon}</button><button class="keyboard-switch ${keyboardMode?'selected':''}" aria-label="${keyboardMode?'收起键盘':'切换打字输入'}" aria-pressed="${keyboardMode}" onclick="App.toggleKeyboard()">${keyboardIcon}</button></div><small class="voice-caption">${voiceActive?'正在听，再点一下结束':keyboardMode?'也可以点击麦克风说话':'点击说话'}</small></div>`}
function toggleVoice(){if(voiceActive){voiceRecognition?.stop();return}const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){keyboardMode=true;render();notify('当前浏览器不支持语音识别，请使用打字输入');return}const context=view,session=++voiceSession;const rec=new Recognition();voiceRecognition=rec;rec.lang=context==='setup'?'zh-CN':'en-US';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=1;voiceActive=true;rec.onresult=e=>{if(session!==voiceSession||view!==context)return;let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;if(!t)return;if(context==='setup')setupDraft=t;else if(context==='free')freeDraft=t;else if(context==='practice')practiceDraft=t;else draft=t;keyboardMode=true;voiceActive=false;render();notify('已转为文字，确认后发送')};rec.onerror=e=>{if(session!==voiceSession)return;voiceActive=false;voiceRecognition=null;keyboardMode=true;render();notify(e.error==='not-allowed'?'麦克风权限未开启，可以使用打字输入':e.error==='no-speech'?'没有听清，请再试一次或打字输入':'语音识别暂不可用，请使用打字输入')};rec.onend=()=>{if(session!==voiceSession)return;voiceActive=false;voiceRecognition=null;render()};render();try{rec.start()}catch{voiceActive=false;voiceRecognition=null;keyboardMode=true;render();notify('无法开启麦克风，请使用打字输入')}}
function generatePlan(){if(setupBusy)return;setupBusy=true;render();const tk=++setupToken;setTimeout(()=>{if(tk!==setupToken)return;profile={id:Date.now(),...setupAnswers,done:true,level:setupAnswers.level,self:setupAnswers.level,topics:setupAnswers.subtopics,theme:setupAnswers.theme};addedPlans.push({...profile});demoStore.setItem('coach-plans-v10',JSON.stringify(addedPlans));persistProfile();setupBusy=false;view='home';render();notify('学习计划已添加')},650)}
let lastView='',followNext=false;
function render(){ const old=document.querySelector('#app .scroll'),pos=old?.scrollTop||0,same=lastView===view,follow=followNext||!same;followNext=false;lastView=view; $('#app').innerHTML=view==='knowledge'?knowledgeMarkup():view==='loading'?loadingMarkup():view==='home'?homeMarkup():view==='intro'?introMarkup():view==='chat'?chatMarkup():view==='summary'?summaryMarkup():view==='free'?freeMarkup():view==='practice'?practiceMarkup():view==='setup'?setupMarkup():view==='plan'?planMarkup():libraryMarkup();const next=document.querySelector('#app .scroll');if(next)next.scrollTop=follow&&(view==='chat'||view==='free'||view==='setup')?next.scrollHeight: same?pos:0}
async function stream(text,zh=''){++token;busy=false;messages.push({role:'ai',text,zh,typing:false});followNext=true;render()}
function freeSend(text){if(freeBusy)return;const t=text||$('#freeinput').value.trim();if(!t)return notify('输入想聊的内容，或选择一个建议');freeDraft='';freeMessages.push({role:'user',text:t});freeBusy=true;render();const reply=/旅行/.test(t)?'好，我们聊旅行。先从一个轻松的问题开始：If you could go anywhere for a weekend, where would you go?':/话题/.test(t)?'可以聊最近看过的电影、理想的周末，或一次难忘的旅行。选一个你感兴趣的，也可以直接告诉我你今天的心情。':/自然/.test(t)?'把你想表达的中文或英文发给我。我们可以一起看看用词、语气，以及什么场合这样说更合适。':'我收到你的想法了。这里演示自由聊天的收发方式；接入 AI 后，教练会根据你刚才的内容继续交流。';const m={role:'ai',text:''};freeMessages.push(m);m.text=reply;freeBusy=false;followNext=true;render()}
function msgMarkup(m,i){if(m.feedback)return `<article class="msg feedback-only">${feedbackMarkup(m.feedback,i)}</article>`;const isCoach=m.role==='coach'||m.role==='ai';return `<article class="msg ${m.role} ${isCoach?'with-avatar':''}">${isCoach?avatar():''}<div class="message-content"><div class="bubble">${m.role==='prompt'?'<small>✧ 试着表达</small><p>“'+escape(m.text)+'”</p>':escape(m.text)}${m.typing?'<span>▍</span>':''}${m.role==='ai'&&!m.typing?`<button class="audio-button" aria-label="重听教练英文" onclick="App.replayMessage(${i})">${speakerIcon}</button>`:''}${m.zh?`<button onclick="App.translate(${i})">${translated[i]?'收起中文':'查看中文'}</button>${translated[i]?`<div class="translate">${escape(m.zh)}</div>`:''}`:''}</div>${isCapstone&&m.role==='user'?`<button class="polish-button" onclick="App.polishReply(${i})">✧ 润色</button>`: ''}</div></article>`}
function switchPlans(){if(!addedPlans.length)addedPlans.push({...profile,id:Date.now()});sheet(`<h2>切换学习计划</h2>${addedPlans.map((p,i)=>`<button class="plan-option" onclick="App.selectPlan(${i})"><b>${escape(p.topic||'我的计划')} · ${escape(p.level)}</b><small>${escape((p.subtopics||[]).join('、'))}</small></button>`).join('')}<button class="textbtn" onclick="App.onboard()">＋ 生成新计划</button>`)}
function selectPlan(i){cancel();profile={...addedPlans[i]};expandedTopics={};persistProfile();view='home';close();render()}
function feedbackMarkup(f,i){return `<section class="swipe-feedback compact-feedback" id="feedback-${i}"><div class="feedback-overview"><small class="assessment-state">${f.sample?'示例反馈':f.matched?'与示范一致':'待评测 · AI 未连接'}</small><p class="feedback-answer">${escape(f.answer)}</p><div class="compact-scores"><span>语法准确性 <b>${f.grammarScore??'—'}</b></span><span>语义贴合度 <b>${f.semanticScore??'—'}</b></span></div><small>${f.matched?'已用上的地道表达':'更地道的表达'}</small><p class="target-line">${highlightedSentence(f.target,f.targets)} <button class="audio-button" aria-label="重听" onclick="App.replayTarget(${i})">${speakerIcon}</button></p></div><div class="analysis-box"><div class="feedback-tabs" role="tablist"><button role="tab" aria-selected="true" onclick="App.showFeedbackPanel(${i},0)">语法解析</button><button role="tab" aria-selected="false" onclick="App.showFeedbackPanel(${i},1)">表达解析</button></div><div class="feedback-rail" id="feedback-rail-${i}" onscroll="App.syncFeedbackPanel(${i},this)"><section class="feedback-panel"><p>${f.grammarScore===100?'句子语法成立。是否使用目标词组，不影响语法正确性。':'已记录你的回答，连接 AI 后提供针对这句话的语法分析。'}</p></section><section class="feedback-panel"><p>${escape(f.explanation)}</p>${f.matched?'':`<p>${escape(f.difference)}</p>`}</section></div></div></section>`}
function missionHeader(){return `<div class="mission-top"><div class="row between"><b>本次任务</b><small>${Object.values(capstoneChecks).filter(Boolean).length} / ${goals.length}</small></div><ul>${goals.map((g,i)=>`<li class="${i===stage?'current':''}"><button aria-label="${capstoneChecks[i]?'已完成':'确认完成'}${escape(g)}" onclick="App.completeMission(${i})">${capstoneChecks[i]?'☑':'□'}</button><span>${escape(g)}</span></li>`).join('')}</ul><small>自由输入后可自行勾选 · AI 判定待接入</small></div>`}
function relevantPoints(task=stage){const units=curriculum.filter(u=>u.theme===activeUnit.theme&&!u.capstone);if(units.length>1){const map={social:[0,1,2,3,1],travel:[0,1,2,3,0],work:[0,1,2,3,3]};return pointsFor(units[(map[activeUnit.theme]||[])[task]??0],lessonLevel).slice(0,3)}const row=units[0]?.rows[task]?.[lessonLevel];return (row?.targets||[]).map(label=>({label,example:row.en,meaning:row.cn}))}
function practiceTaskMarkup(){return `<details class="mission"><summary>回顾当前任务可用表达</summary>${relevantPoints().map(p=>`<p><b>${escape(p.label)}</b><br><small>${escape(p.meaning)}</small></p>`).join('')}</details>`}
function chatMarkup(){const ended=stage>=frames.length;return `<header class="header"><div class="row between"><button class="back" onclick="App.exitPrompt()">‹</button>${avatar('header-avatar')}<button class="textbtn" aria-label="课程知识点" onclick="App.openKnowledge('${activeUnit.id}')">▤</button></div>${isCapstone?missionHeader():`<div class="path">${goals.map((g,i)=>`<span class="${i<stage?'done':i===stage?'active':''}"></span>`).join('')}</div><div class="row between goal"><span>${escape(activeUnit.title)}</span><span>${Math.min(stage,5)} / 5</span></div>`}</header><div class="scroll chatlog" id="log">${messages.map(msgMarkup).join('')}${ended?'<button class="primary space" onclick="App.summary()">看看本课收获 →</button>':isCapstone?practiceTaskMarkup():promptMarkup()}</div><div class="composer">${inputDock('chat')}${!ended?`<div class="demo"><button ${busy?'disabled':''} onclick="App.simulation()">▷ ${isCapstone?'演示自由回答':'体验示例反馈'}</button>${repeatTarget?'<button onclick="App.skipRetry()">暂时跳过本轮</button>':''}</div>`:''}</div>`}
function acceptMission(t,sim){messages.push({role:'user',text:t,task:stage});records.push({stage,text:t,sim});draft='';followNext=true;if(sim)completeMission(stage);else render()}
function completeMission(i){if(capstoneChecks[i])return;if(!records.some(r=>r.stage===i))return notify('先围绕这项任务说一说，再确认完成');capstoneChecks[i]=true;stage=goals.findIndex((g,j)=>!capstoneChecks[j]);if(stage<0){stage=goals.length;stream('Thanks for talking that through with me. See you soon!')}else stream(fieldTasks[activeUnit.theme].questions[stage])}
function polishReply(i){const m=messages[i];sheet(`<h3>提升这句话的表达</h3><p class="space">${escape(m.text)}</p><small>AI 润色尚未连接。以下为当前任务的参考表达，并非对你原句的实时改写。</small>${relevantPoints(m.task??0).slice(0,2).map(p=>`<div class="card"><p>${highlightedSentence(p.example,[p.label])}</p><small>${escape(p.meaning)}</small></div>`).join('')}`)}

function practiceMarkup(){const state=practiceStore[practiceKey],step=state.step;if(step>=3&&(!practiceBank[practiceKey][1]?.source||!practiceBank[practiceKey][2]?.source))return missingSourceMarkup();if(step>=5)return `<header class="header"><b>表达加练</b></header><div class="scroll"><h2>这组练习已完成</h2><p>${escape(practiceKey)}</p><p class="muted">完成五步练习，记录已保存。</p></div><div class="composer"><button class="primary" onclick="App.practiceBack()">返回我的表达</button></div>`;const sentence=practiceSentence(),phrase=practiceKey.split(' · ')[0];return `<header class="header"><div class="row between"><button class="back" onclick="App.practiceBack()">‹</button><b>${practiceTasks[step]}</b><small>${step+1} / 5</small></div><div class="path">${practiceTasks.map((_,i)=>`<span class="${i<step?'done':i===step?'active':''}"></span>`).join('')}</div></header><div class="scroll drill-scroll"><small>${escape(phrase)}</small><div class="drill-sentence">${step<2?`<p lang="en">${step===0?highlightedSentence(sentence.en,[phrase]):escape(sentence.cloze).replace('______','<mark>______</mark>')}</p>${step===0?`<button class="audio-button" aria-label="听整句" onclick="App.practiceListen()">${speakerIcon}</button>`:''}`:''}<p class="drill-translation">${escape(sentence.cn)}</p></div>${sourceMarkup(sentence)}${practiceFeedback?`<div class="card"><small>你的作答${practiceAttempt.sim?' · 演示':''}</small><p>${escape(practiceAttempt.text)}</p><small>参考表达 · 未进行 AI 评分</small><p>${highlightedSentence(sentence.en,[phrase])}</p><div class="row between"><button class="textbtn" onclick="App.practiceRetry()">再练一次</button><button class="textbtn" onclick="App.practiceNext()">${step===4?'完成练习':'下一步'} →</button></div></div>`:'<p class="footnote">'+(step===0?'听一遍，再跟着说。':step===1?'根据中文，说出空缺的表达。':'根据中文，完整说出这句话。')+'</p>'}</div><div class="composer">${inputDock('practice')}${!practiceFeedback?'<div class="demo"><button onclick="App.practiceSubmit(true)">▷ 演示回答</button></div>':''}</div>`}

function promptMarkup(){return `<div class="flowcue"><span>✧</span><div><small>试着表达</small><p>“${escape(cue().cn)}”</p></div></div><div class="tryline"><span>现在试着用英语说…</span><button class="bulb ${ladder?'lit':''}" aria-label="${ladder?'关闭':'打开'}原句提示" aria-pressed="${ladder}" onclick="App.toggleLadder()">${bulb}</button></div>${ladder?`<div class="source-sentence"><small>本轮表达示范</small><p>${escape(expected())}</p><button class="audio-button" aria-label="朗读表达示范" onclick="App.listen()">${speakerIcon}</button></div>`:''}`}

function accept(t,sim){if(busy||stage>=frames.length)return;close();const detail={...teachingDetail(),targets:frames[stage].targets};const matched=normalizedAnswer(t)===normalizedAnswer(expected());const customExample=sim&&activeUnit.id==='invite'&&stage===0&&lessonLevel==='A2'&&!repeatTarget;messages.push({role:'prompt',text:cue().cn},{role:'user',text:t});const previous=records.find(r=>r.stage===stage);const attempt=(previous?.attempts||1)+(previous?1:0);if(!previous)records.push({stage,text:t,support:ladder?3:0,sim});else {previous.retry=t;previous.attempts=attempt;}if(matched){draft='';ladder=false;awaitingFeedback=true;nextExchange();return}messages.push({role:'coach',text:'',feedback:{answer:t,target:expected(),sample:sim,matched,grammarScore:sim||matched?100:null,semanticScore:matched?100:sim?(customExample?80:100):null,sampleNote:customExample?'这个预设示例的语法完整，可以发出邀请。不使用 come over，不影响语法正确性。':'这是一条预设的正确表达示例。分数仅用于展示反馈样式，不代表对自由输入的实时评测。',...detail,difference:customExample?'你的句子用 visit us 发出邀请，语法没问题，但没有交代会有其他客人。示范中的 have a few people over 补充了小聚会背景；come over 更有“来家里坐坐”的随意感。':detail.difference}});draft='';ladder=false;awaitingFeedback=true;const feedback=messages[messages.length-1].feedback;feedback.needsRetry=!(Number.isFinite(feedback.semanticScore)&&feedback.semanticScore>=95);if(attempt>=2||(Number.isFinite(feedback.semanticScore)&&feedback.semanticScore>=95)){nextExchange()}else{awaitingFeedback=false;repeatTarget=true;followNext=true;render()}}
function practiceMarkup(){const state=practiceStore[practiceKey],step=state.step;if(step>=3&&(!practiceBank[practiceKey][1]?.source||!practiceBank[practiceKey][2]?.source))return missingSourceMarkup();if(step>=5)return `<header class="header"><b>表达加练</b></header><div class="scroll"><h2>这组练习已完成</h2><p>${escape(practiceKey)}</p><p class="muted">完成五步练习，记录已保存。</p></div><div class="composer"><button class="primary" onclick="App.practiceBack()">返回我的表达</button></div>`;const sentence=practiceSentence(),phrase=practiceKey.split(' · ')[0];return `<header class="header"><div class="row between"><button class="back" onclick="App.practiceBack()">‹</button><b>${practiceTasks[step]}</b><small>${step+1} / 5</small></div><div class="path">${practiceTasks.map((_,i)=>`<span class="${i<step?'done':i===step?'active':''}"></span>`).join('')}</div></header><div class="scroll drill-scroll"><small>${escape(phrase)}</small><div class="drill-sentence">${step<2?`<p lang="en">${step===0?highlightedSentence(sentence.en,[phrase]):escape(sentence.cloze).replace('______','<mark>______</mark>')}</p>${step===0?`<button class="audio-button" aria-label="听整句" onclick="App.practiceListen()">${speakerIcon}</button>`:''}`:''}${practiceFeedback?`<p class="answer-on-question"><small>你的作答${practiceAttempt.sim?' · 演示':''}</small>${escape(practiceAttempt.text)}</p>`:''}<p class="drill-translation">${escape(sentence.cn)}</p></div>${sourceMarkup(sentence)}${practiceFeedback?`<div class="drill-review"><small>参考表达 · 未进行 AI 评分</small><p>${highlightedSentence(sentence.en,[phrase])}</p><div class="row between"><button class="textbtn" onclick="App.practiceRetry()">再练一次</button><button class="textbtn" onclick="App.practiceNext()">${step===4?'完成练习':'下一步'} →</button></div></div>`:'<p class="footnote">'+(step===0?'听一遍，再跟着说。':step===1?'根据中文，说出空缺的表达。':'根据中文，完整说出这句话。')+'</p>'}</div><div class="composer">${inputDock('practice')}${!practiceFeedback?'<div class="demo"><button onclick="App.practiceSubmit(true)">▷ 演示回答</button></div>':''}</div>`}

const revealedBubbles=new Set();let revealGeneration=0;
function revealBubbles(){const generation=++revealGeneration;if(!['setup','chat','free'].includes(view)||!document.querySelectorAll)return;const all=[...document.querySelectorAll('#log .msg')];let delay=0;const pending=[];all.forEach((node,i)=>{if(node.classList.contains('user')||node.classList.contains('prompt'))return;const key=view+'|'+i+'|'+node.textContent;if(revealedBubbles.has(key))return;const wait=delay;delay+=650;if(!wait){revealedBubbles.add(key);return}node.hidden=true;pending.push({node,key,wait})});if(!pending.length)return;const composer=document.querySelector('#app .composer');const prompt=document.querySelector('#log .flowcue');const ladder=document.querySelector('#log .tryline');const brief=document.querySelector('#log .plan-brief');const controls=[composer,prompt,ladder,brief].filter(Boolean);controls.forEach(x=>{x.style.visibility='hidden';x.style.pointerEvents='none'});pending.forEach(({node,key,wait},j)=>setTimeout(()=>{if(generation!==revealGeneration)return;const log=document.querySelector('#log'),atBottom=log&&log.scrollHeight-log.scrollTop-log.clientHeight<100;node.hidden=false;revealedBubbles.add(key);if(j===pending.length-1)controls.forEach(x=>{x.style.visibility='';x.style.pointerEvents=''});if(log&&atBottom)log.scrollTop=log.scrollHeight},wait))}

function revealBubbles(){const generation=++revealGeneration;if(!['setup','chat','free'].includes(view)||!document.querySelectorAll)return;const all=[...document.querySelectorAll('#log .msg')],pending=[];for(const [i,node] of all.entries()){if(node.classList.contains('user')||node.classList.contains('prompt'))continue;const key=view+'|'+i+'|'+node.textContent;if(revealedBubbles.has(key))continue;node.hidden=true;pending.push({node,key})}if(!pending.length)return;const log=document.querySelector('#log');let follow=true;const stopFollow=()=>{follow=false};if(log){log.addEventListener?.('wheel',e=>{if(e.deltaY<0)stopFollow()},{passive:true,once:true});log.addEventListener?.('touchstart',stopFollow,{passive:true,once:true})}const scrollLatest=()=>{if(generation!==revealGeneration||!follow||!log)return;log.scrollTop=log.scrollHeight};const composer=document.querySelector('#app .composer');if(composer)composer.inert=true;const delayed=[document.querySelector('#log .flowcue'),document.querySelector('#log .tryline'),document.querySelector('#log .plan-brief')].filter(Boolean);delayed.forEach(n=>n.hidden=true);scrollLatest();pending.forEach(({node,key},j)=>setTimeout(()=>{if(generation!==revealGeneration)return;node.hidden=false;revealedBubbles.add(key);if(j===pending.length-1){if(composer)composer.inert=false;delayed.forEach(n=>n.hidden=false)}scrollLatest();requestAnimationFrame(scrollLatest)},180+j*650))}
